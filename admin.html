<!-- Touge Net settings live in config.js next to this file. -->
<script src="config.js"></script>
<!-- If you'd rather not use config.js, you can paste the two values here instead. -->
<script>
window.TOUGE_NET = window.TOUGE_NET || {
  url: "",   // Project URL, e.g. "https://abcdxyz.supabase.co"
  key: ""    // Publishable key, starts with "sb_publishable_"   (never the secret key)
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
/* Touge Net bridge for self-hosting.
   The game was written for Claude's built-in database (window.claude.use('db')). This file gives it the same
   small API on top of Supabase: documents addressed by path, simple queries, and polling instead of live pushes.
   If the config at the top of the page is still blank, nothing is set up and the game plays offline as before. */
(function(){
  const C=window.TOUGE_NET||{};
  const ok=/^https:\/\/[^\s]+$/.test(C.url||'')&&/^(sb_publishable_|eyJ)/.test(C.key||'');
  if(!ok){console.info('Touge Net: no Supabase config yet, playing offline.');return}
  if(!window.supabase||!window.supabase.createClient){console.warn('Touge Net: the Supabase library did not load, playing offline.');return}
  const sb=window.supabase.createClient(C.url.replace(/\/+$/,''),C.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'tougeNet.auth'}});
  const T='docs',FAST=6000,SLOW=30000;
  let me=null;
  /* every device signs in anonymously once; the session stays in this browser */
  function session(){if(!me)me=(async()=>{const g=await sb.auth.getSession();if(g.data&&g.data.session)return g.data.session.user.id;
      const r=await sb.auth.signInAnonymously();if(r.error){me=null;throw r.error}return r.data.session.user.id})();return me}
  function E(e){const m=(e&&e.message)||'Touge Net error',x=new Error(m),c=e&&e.code;
    x.code=c==='42501'||/row-level security|permission denied|not allowed/i.test(m)?'invalid_argument':c==='PGRST301'||/JWT/i.test(m)?'revoked':/quota|limit/i.test(m)?'quota_exceeded':'unavailable';return x}
  const parent=p=>p.split('/').slice(0,-1).join('/'),leaf=p=>p.split('/').pop();
  const rid=()=>{try{return Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>b.toString(36).padStart(2,'0')).join('').slice(0,16)}catch(e){return Math.random().toString(36).slice(2,12)+Date.now().toString(36)}};
  const meta={fromCache:false,hasPendingWrites:false};
  const dsnap=(path,x)=>({id:leaf(path),ref:{path},exists:x!=null,data:()=>x==null?undefined:x,metadata:meta});
  const qsnap=rows=>{const docs=rows.map(r=>dsnap(r.path,r.data));return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}};
  /* "live" listeners poll; they pause while the tab is hidden and refresh as soon as it comes back */
  function poll(fetch,next,error,ms){let on=true,last=null,tm=0;
    const tick=async()=>{if(!on)return;if(!document.hidden){try{const r=await fetch(),s=JSON.stringify(r);if(s!==last){last=s;next(r)}}catch(e){error&&error(E(e))}}if(on)tm=setTimeout(tick,ms)};
    const vis=()=>{if(on&&!document.hidden){clearTimeout(tm);tick()}};document.addEventListener('visibilitychange',vis);tick();
    return()=>{on=false;clearTimeout(tm);document.removeEventListener('visibilitychange',vis)}}
  /* a handle counts as yours only if this browser's sign-in owns it, even when an imported save carries the same device token */
  async function readOne(path){const h=path.startsWith('handles/'),{data,error}=await sb.from(T).select(h?'data,owner':'data').eq('path',path).maybeSingle();if(error)throw error;if(!data)return null;
    if(h&&data.data){let mine=false;try{mine=data.owner===await session()}catch(e){}if(!mine)return Object.assign({},data.data,{dh:'other:'+String(data.data.dh||'')})}return data.data}
  function doc(path){return{id:leaf(path),path,
    async get(){try{return dsnap(path,await readOne(path))}catch(e){throw E(e)}},
    async set(v){await session();const{error}=await sb.from(T).upsert({path,coll:parent(path),id:leaf(path),data:v},{onConflict:'path'});if(error)throw E(error)},
    async update(v){await session();const{data,error}=await sb.rpc('doc_merge',{p:path,patch:v});if(error)throw E(error);if(!data)throw E({code:'42501',message:'not allowed'})},
    async delete(){await session();const{error}=await sb.from(T).delete().eq('path',path);if(error)throw E(error)},
    async acquire(){return{acquired:true}},
    onSnapshot(n,e){return poll(()=>readOne(path),x=>n(dsnap(path,x)),e,FAST)},
    collection:p=>coll(path+'/'+p)}}
  function coll(path,q){q=q||{w:[],o:null,l:0};
    const run=async()=>{let r=sb.from(T).select('path,data').eq('coll',path);q.w.forEach(([f,,v])=>{r=r.eq('data->>'+f,String(v))});
      r=q.o?r.order('data->'+q.o[0],{ascending:q.o[1]!=='desc',nullsFirst:false}):r.order('path');if(q.l)r=r.limit(q.l);
      const{data,error}=await r;if(error)throw error;return data||[]};
    return{path,
      where:(f,op,v)=>coll(path,Object.assign({},q,{w:q.w.concat([[f,op,v]])})),
      orderBy:(f,d)=>coll(path,Object.assign({},q,{o:[f,d||'asc']})),
      limit:n=>coll(path,Object.assign({},q,{l:n})),
      async get(){try{return qsnap(await run())}catch(e){throw E(e)}},
      onSnapshot(n,e){return poll(run,rows=>n(qsnap(rows)),e,path==='players'?SLOW:FAST)},
      doc:id=>doc(path+'/'+(id||rid())),
      async add(v){const d=doc(path+'/'+rid());await d.set(v);return d}}}
  const db={doc,collection:p=>coll(p)};
  const user={id:async()=>{try{return await session()}catch(e){return null}},can:async()=>true,isOwner:async()=>false,canEdit:async()=>false};
  window.TOUGE_NETX={sb,session};
  const prev=window.claude||{};
  window.claude=Object.assign({},prev,{use:async n=>{
    if(n==='db'){try{await session();return db}catch(e){console.warn('Touge Net: anonymous sign-in failed, playing offline.',e&&e.message);return null}}
    if(n==='user')return user;return prev.use?prev.use(n):null}});
})();

</script>

#adm .brand{display:flex;flex-direction:column}

#adm .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#adm .achip{font-family:var(--f-dot);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--mute)}
#adm .achip.ok{border-color:var(--good);color:var(--good)}

#adm .atabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}

#adm .alist{position:sticky;top:12px;max-height:calc(100vh - 40px);gap:8px}

#adm .achips{display:flex;flex-wrap:wrap;gap:6px}
#adm .chip{appearance:none;background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
#adm .chip.on{border-color:var(--sodium);color:var(--ink)}
#adm .arows{display:flex;flex-direction:column;gap:4px;overflow-y:auto;min-height:120px;scrollbar-width:thin}
#adm .arow{appearance:none;display:grid;grid-template-columns:40px minmax(0,1fr) 46px;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:10px;padding:6px 8px;color:inherit;font:inherit;cursor:pointer}
#adm .arow:hover{background:var(--panel)}
#adm .arow.on{border-color:var(--sodium);background:var(--panel)}
#adm .arow .av{width:40px;height:40px}
#adm .noav{display:grid;place-items:center;color:var(--dim);font-family:var(--f-display)}
#adm .an{display:flex;flex-direction:column;min-width:0}
#adm .an b,#adm .an .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#adm .povr{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
#adm .povr small{font-family:var(--f-dot);font-size:9px;color:var(--mute);letter-spacing:.08em}
#adm .adetail{gap:12px}
#adm .adetail h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px}
#adm .adetail h3{margin:6px 0 0;font-family:var(--f-dot);font-weight:400;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#adm .adetail .inl{display:inline;margin-left:6px}
#adm .kv{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute)}

#adm .phr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
#adm .phr:first-child,#adm .pdr:first-child{border-top:0}
#adm .res{font-family:var(--f-dot);font-size:11px;letter-spacing:.06em;border:1px solid var(--line);border-radius:6px;padding:2px 6px;text-align:center}
#adm .res.L{color:var(--brake);border-color:currentColor}
#adm .res.D,#adm .res.st{color:var(--mute)}
#adm .btn.sm{padding:5px 10px;font-size:12.5px}
#adm .btn.ghost{background:none}
#adm .btn:disabled{opacity:.45;cursor:not-allowed}
#adm .adanger{flex-direction:row;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-color:rgba(255,77,77,.4)}
#adm .adanger>div{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 260px}
#adm .aconfirm{border-color:var(--brake);gap:8px}
#adm .tog{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
#adm .tog input{accent-color:var(--brake);margin-top:2px}
#adm .agate{gap:8px}
#adm .agate.bad{border-color:rgba(255,77,77,.5)}
#adm .acode{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--night);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#adm .acode code{font-family:var(--f-dot);font-size:12.5px;word-break:break-all;flex:1 1 300px;min-width:0}
#adm .abans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
#adm .brow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
#adm .brow:first-of-type{border-top:0}
#adm .brow .meta{flex:1}
#adm .aempty{padding:12px 4px}
#adm .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#adm :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.toast.bad{border-color:var(--brake)}
@media (max-width:860px){#adm .agrid{grid-template-columns:minmax(0,1fr)}#adm .alist{position:static;max-height:none}#adm .arows{max-height:50vh}#adm .phr{grid-template-columns:56px minmax(0,1fr)}#adm .phr .btn{grid-column:2;justify-self:start}}

</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Press+Start+2P&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: framed full-height isometric pass on the left, garage ledger docked right; stacked map-over-ledger on phones */
  --night:#0b1020; --panel:#11172e; --raised:#192040; --line:#283158; --ink:#efe9dc; --mute:#8f99bc; --dim:#5f6992;
  --sodium:#ffb03b; --sodium-ink:#1e1404; --brake:#ff4d4d; --good:#5bd38a; --warn:#ffcd57; --cyan:#7fd4ff;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-dot:"DotGothic16",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.hud{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .k{font-family:var(--f-display);font-size:22px;letter-spacing:.04em;line-height:1}
.brand .e{font-family:var(--f-dot);color:var(--mute);font-size:12px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.days{display:flex;gap:4px;flex:1;justify-content:center;min-width:0}
.day{font-family:var(--f-dot);font-size:12px;padding:5px 0;width:44px;border-radius:6px;color:var(--dim);border:1px solid var(--line);text-align:center;line-height:1.15}
.day small{display:block;font-size:9px;letter-spacing:.06em}
.day.past{opacity:.45}
.day.now{background:var(--sodium);color:var(--sodium-ink);border-color:var(--sodium)}
.day.sat{border-color:#6a2c38;color:#d07a86}
.day.sat.now{background:var(--brake);border-color:var(--brake);color:#fff}
.stats{display:flex;gap:16px;align-items:center}
.stat label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.stat b{font-family:var(--f-dot);font-size:19px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b.cred{color:var(--sodium)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-family:var(--f-dot)}
.iconbtn:hover{border-color:var(--sodium)}

/* main */
main{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:12px;min-height:0}
#mapwrap{position:relative;min-height:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#070a16;touch-action:none;user-select:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.ov{position:absolute;z-index:2}
.clock{top:12px;left:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-family:var(--f-dot);font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(10,14,30,.78);border:1px solid var(--line);white-space:nowrap}
.pill.amber{color:var(--sodium);border-color:rgba(255,176,59,.4)}
.pill.wet{color:var(--cyan)}
.pill.fog{color:#c9cbd6}
.pill.snow{color:#f2f6ff}
.pill.season.s0{color:#f4a9c0}.pill.season.s1{color:#8fd46a}.pill.season.s2{color:#f0913a}.pill.season.s3{color:#cfe3ff}
.mapctl{top:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 200px)}
.mapctl button{min-width:32px;height:32px;padding:0 9px;border-radius:8px;background:rgba(10,14,30,.8);border:1px solid var(--line);cursor:pointer;font-family:var(--f-dot);font-size:12px}
.mapctl button.on{border-color:var(--sodium);color:var(--sodium)}
#live{top:54px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-height:calc(100% - 250px);overflow:hidden}
.lc{cursor:pointer}
.lc.on{border-color:var(--sodium);box-shadow:0 0 0 1px var(--sodium)}
.lc.lk,.lc.lk.on{border-color:#7fe0ff;box-shadow:0 0 0 1px #7fe0ff}
html.phone .lc.lk{border-color:#7fe0ff}
.lc .tf{font-family:var(--f-dot);font-size:10px;color:var(--mute)}
.lc .ovs{font-family:var(--f-dot);font-size:10px;color:var(--mute);white-space:nowrap}.lc .ovs b{color:var(--sodium);font-size:12px;font-weight:400}
html.phone .lc .ovs{display:none}
.driving #ticker{display:none}
#hint{left:12px;bottom:58px;width:min(380px,calc(100% - 24px));background:rgba(10,14,30,.9);border:1px solid rgba(255,176,59,.55);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#hint[hidden]{display:none}
.tyrerow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.tyreopt{border:1px solid var(--line);border-radius:10px;padding:7px;display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute);min-width:0}
.tyreopt b{color:var(--ink);font-size:12px}
.tyreopt.on{border-color:var(--sodium);background:rgba(255,176,59,.06)}
.tyreopt .wetg{color:var(--cyan)}
.tyreopt .btn.sm{padding:4px 7px;font-size:11px}
.wxnote{color:var(--cyan)!important;font-size:13px}
#coach{position:fixed;z-index:72;width:min(330px,calc(100vw - 24px));background:rgba(10,14,30,.97);border:1px solid var(--sodium);border-radius:12px;padding:12px 14px 12px;box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;transition:left .18s ease,top .18s ease}
#coach[hidden],#coachRing[hidden]{display:none}
#coach.center{width:min(420px,calc(100vw - 24px));padding:18px 20px}
#coach .ch{display:flex;flex-direction:column;gap:4px}
#coach .cn{font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:.08em;color:var(--mute)}
#coach b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--sodium);line-height:1.25}
#coach p{margin:0;font-size:13px;line-height:1.55;color:#d7dbea}
#coach .cb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
#coach .btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
#coachRing{position:fixed;z-index:71;border:2px solid var(--sodium);border-radius:12px;pointer-events:none;animation:coachPulse 1.4s ease-in-out infinite;transition:all .18s ease}
#coachRing.bare{border:0;animation:none}
#coachRing.dim{box-shadow:0 0 0 200vmax rgba(4,6,14,.5)}
@keyframes coachPulse{0%,100%{outline:0 solid rgba(255,176,59,.5)}50%{outline:6px solid rgba(255,176,59,0)}}
@media (prefers-reduced-motion:reduce){#coachRing{animation:none}#coach,#coachRing{transition:none}}
#hint b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--sodium)}
#hint p{margin:0;font-size:13px;line-height:1.5;color:#d7dbea}
.driving #hint{display:none}
#cutfx{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#feed{left:12px;top:150px;display:flex;flex-direction:column;gap:4px;max-width:min(360px,55%);pointer-events:none}
#feed div{font-size:12px;line-height:1.4;background:rgba(10,14,30,.8);border:1px solid var(--line);padding:5px 9px;border-radius:8px;animation:tin .25s ease-out}
#feed div span{font-family:var(--f-dot);color:var(--sodium);margin-right:6px}
.lc .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.driving #actionbar{right:auto;left:50%;transform:translateX(-50%);bottom:14px}
#map{image-rendering:pixelated}
.lc{display:grid;grid-template-columns:30px 1fr auto;gap:4px 8px;align-items:center;width:230px;padding:6px 8px;border-radius:10px;background:rgba(10,14,30,.84);border:1px solid var(--line)}
.lc img{width:30px;height:30px;border-radius:6px;image-rendering:pixelated;grid-row:span 2}
.lc .n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc .hh,.hc .hh{margin-left:5px;font-weight:600;color:var(--sodium);font-size:.92em}
.lc .spd{font-family:var(--f-dot);font-size:16px;text-align:right;font-variant-numeric:tabular-nums;grid-row:span 2}
.lc .spd small{font-size:9px;color:var(--mute);display:block}
.lc .bars{display:flex;gap:6px;align-items:center}
.gm{position:relative;width:54px;height:6px;border-radius:3px;background:#222a4d}
.gm i{position:absolute;top:-2px;width:10px;height:10px;border-radius:50%;background:var(--cyan);transform:translateX(-50%);left:50%}
.tb{flex:1;height:6px;border-radius:3px;background:#222a4d;overflow:hidden}
.tb i{display:block;height:100%;background:var(--ink)}
#ticker{left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;max-width:min(420px,60%);pointer-events:none}
#ticker div{font-size:12px;color:var(--mute);background:rgba(10,14,30,.66);padding:3px 8px;border-radius:6px;width:fit-content;max-width:100%}
#ticker div:last-child{color:var(--ink)}
#actionbar{right:12px;bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
.why{font-size:12px;color:var(--warn);background:rgba(10,14,30,.8);padding:6px 10px;border-radius:8px}
#toasts{top:54px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--raised);border:1px solid var(--sodium);color:var(--ink);padding:8px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-6px);opacity:0}}

/* buttons */
.btn{border:1px solid var(--line);background:var(--raised);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn small{font-family:var(--f-dot);font-weight:400;opacity:.75}
.btn:hover:not(:disabled){border-color:var(--sodium)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--sodium);color:var(--sodium-ink);border-color:var(--sodium)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.race{background:var(--brake);border-color:var(--brake);color:#fff}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn.big{padding:13px 20px;font-size:15px}

/* panel */
#panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line);flex:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);padding:9px 2px 7px;cursor:pointer}
.tab .jp{display:block;font-family:var(--f-display);font-size:15px;color:var(--dim);line-height:1.2}
.tab .en{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tab.on{color:var(--ink);border-bottom-color:var(--sodium)}
.tab.on .jp{color:var(--sodium)}
.tab{position:relative}.tab .beta{font-family:var(--f-body,inherit);font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brake);margin-left:2px;vertical-align:super;line-height:0}
.tab.badge::after{content:attr(data-n);position:absolute;top:4px;left:4px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--brake);color:#fff;font-size:10px;font-weight:700;line-height:15px;box-sizing:border-box}
.tin{background:#0f1430;border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);font:inherit;font-size:14px;min-width:0;flex:1}
.tin:focus{outline:2px solid var(--sodium);outline-offset:1px}
.hrow{display:flex;align-items:center;gap:6px}.hrow .at{font-family:var(--f-display);font-size:18px;color:var(--sodium)}
.prow{display:grid;grid-template-columns:auto 36px minmax(0,1fr) auto;gap:8px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}.prow .av{width:36px;height:36px}.prow:not(:has(.rk)){grid-template-columns:36px minmax(0,1fr) auto}
.prow .rk{font-family:var(--f-dot);color:var(--sodium);width:22px;text-align:right}
.prow .pn{display:flex;flex-direction:column;min-width:0}.prow .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .povr{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:18px;line-height:1}.prow .povr small{font-family:inherit;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.prow .pact{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}.prow.me{background:rgba(255,176,59,.06);border-radius:8px}
.btn.on{border-color:var(--sodium);color:var(--sodium)}
.netme .hdl{font-family:var(--f-display);font-size:20px;color:var(--sodium)}
.chrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.chrow:first-of-type{border-top:0}.chrow .meta{display:block}
.chdue{border-color:var(--brake)}.chdue h3{margin:0}
.chf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}.chf select{max-width:100%}
.taunt{font-style:italic;color:var(--sodium)!important}
.hlink{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--mute)}
.hlink:hover,.hlink:focus-visible{color:var(--sodium);text-decoration-color:var(--sodium)}
.mbox h2.phd{color:var(--sodium);font-size:28px}
.pdrv,.phist{gap:0}
.pdr{display:grid;grid-template-columns:40px minmax(0,1.2fr) 44px minmax(0,1.4fr) 44px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.pdr:first-child{border-top:0}
.pdr .av{width:40px;height:40px}.pdr .pn{display:flex;flex-direction:column;min-width:0}.pdr .pn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdr .povr{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:20px;line-height:1}.pdr .povr small{font-size:9px;letter-spacing:.1em;color:var(--mute)}.pdr .povr.pi{color:var(--cyan,#7fd6ff)}
.pcar{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px}.pcar img{width:66px;height:42px;border-radius:6px;flex:none;image-rendering:pixelated}.pcar span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.phr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}.phr:first-child{border-top:0}.phr .meta{display:block}
.res{font-family:var(--f-dot);font-size:11px;letter-spacing:.08em;text-align:center;padding:3px 0;border-radius:6px;border:1px solid}
.res.W{color:var(--good);border-color:currentColor}.res.L{color:var(--brake);border-color:currentColor}.res.D{color:var(--mute);border-color:currentColor}
@media (max-width:560px){.pdr{grid-template-columns:36px minmax(0,1fr) 40px;row-gap:4px}.pdr .pcar{grid-column:2}.pdr .povr.pi{grid-column:3}}
.pbody{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;text-wrap:balance;letter-spacing:.01em}
h2 .jp{font-size:13px;color:var(--dim);margin-left:6px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:4px 0 0;font-weight:700}
.sub{margin:4px 0 0;color:var(--mute);font-size:13px;line-height:1.5}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hint{background:transparent;border-style:dashed;color:var(--mute);font-size:13px;line-height:1.5}
.card.locked{opacity:.55}
.chip{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute);vertical-align:middle;white-space:nowrap}
.chip.amber{color:var(--sodium);border-color:rgba(255,176,59,.45)}
.chip.red{color:var(--brake);border-color:rgba(255,77,77,.45)}
.mvrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip.mv{font-weight:700}
.chip.good{color:var(--good);border-color:rgba(91,211,138,.45)}
.av{image-rendering:pixelated;border-radius:8px;display:block;background:#1a2040}
.drv-top{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center}
.drv-top .av{width:52px;height:52px}
.nm{font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.xpbar{height:4px;border-radius:2px;background:#0f1430;margin-top:5px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--sodium)}
.ovr{text-align:center;font-family:var(--f-dot);line-height:1}
.ovr span{display:block;font-size:10px;color:var(--mute);letter-spacing:.1em}
.ovr b{font-weight:400;font-size:28px;color:var(--sodium)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.st{display:grid;grid-template-columns:1fr auto;gap:2px 6px;font-size:12px;color:var(--mute)}
.st b{font-family:var(--f-dot);font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}
.st i{grid-column:span 2;height:3px;background:#0f1430;border-radius:2px;overflow:hidden}
.st i em{display:block;height:100%;background:linear-gradient(90deg,var(--sodium),#ffd98f)}
.trait{font-size:12px;color:var(--mute);line-height:1.45}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fld{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
select{background:#0f1430;border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:190px}
.tog{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);cursor:pointer}
.tog input{accent-color:var(--sodium)}
.wage{margin-left:auto;font-family:var(--f-dot);font-size:12px;color:var(--mute)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.log li{font-size:12px;color:var(--mute);line-height:1.45;display:grid;grid-template-columns:62px 1fr;gap:8px}
.log li span{font-family:var(--f-dot);color:var(--dim)}

.carhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.carname{font-weight:700;font-size:15px}
.carname .code{font-family:var(--f-dot);color:var(--sodium);margin-right:6px;font-weight:400}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-1px;border:1px solid rgba(255,255,255,.25);margin-right:4px}
.pi{font-family:var(--f-dot);text-align:right;line-height:1}
.pi span{display:block;font-size:10px;color:var(--mute);letter-spacing:.1em}
.pi b{font-weight:400;font-size:24px}
.specs{display:flex;gap:6px;flex-wrap:wrap}
.meter{display:grid;grid-template-columns:76px 1fr 42px;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.meter i{height:6px;border-radius:3px;background:#0f1430;overflow:hidden}
.meter i em{display:block;height:100%}
.meter b{font-family:var(--f-dot);font-weight:400;text-align:right;color:var(--ink)}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:12px;padding-top:6px;border-top:1px solid rgba(40,49,88,.6)}
.mod .ml{min-width:0}
.mod .ml b{display:block;color:var(--ink);font-weight:500}
.mod .ml span{color:var(--mute)}
.pips{display:flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:2px;background:#0f1430;border:1px solid var(--line)}
.pips i.on{background:var(--sodium);border-color:var(--sodium)}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.lvlpips{display:flex;gap:5px}
.lvlpips i{flex:1;height:8px;border-radius:2px;background:#0f1430;border:1px solid var(--line)}
.lvlpips i.on{background:var(--sodium);border-color:var(--sodium)}
.mtn .jpn{font-family:var(--f-display);font-size:22px;line-height:1.1}
.mtn .enn{font-size:13px;color:var(--mute)}
.kv{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.kv b{font-family:var(--f-dot);font-weight:400;color:var(--ink)}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(4,6,14,.74);display:grid;place-items:center;padding-block:max(12px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));backdrop-filter:blur(3px)}
#modal[hidden]{display:none}
textarea.code{width:100%;font-family:var(--f-dot);font-size:12px;line-height:1.4;background:#0f1430;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;word-break:break-all}
.mbox{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.mbox.wide{width:min(1000px,100%)}
.carthumb{display:block;position:relative;width:100%;padding:0;border:1px solid var(--line);border-radius:10px;background:#7d8399;cursor:pointer;overflow:hidden}
.carthumb img{display:block;width:100%;height:auto;aspect-ratio:132/84;image-rendering:pixelated}
.carthumb>.bs{position:absolute;right:8px;bottom:6px;font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:.06em;color:var(--sodium);background:rgba(6,8,18,.75);padding:4px 6px;border-radius:5px}
.carthumb:hover,.carthumb:focus-visible{border-color:var(--sodium)}
.carthumb>.drv{position:absolute;left:8px;top:8px;display:flex;align-items:center;gap:7px;max-width:calc(100% - 16px);padding:4px 9px 4px 4px;border-radius:9px;background:rgba(6,8,18,.8);border:1px solid rgba(255,255,255,.12);text-align:left}
.carthumb>.drv img{width:30px;height:30px;aspect-ratio:auto;border-radius:6px;image-rendering:pixelated;flex:none}
.carthumb>.drv .t{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.carthumb>.drv b{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carthumb>.drv small{font-family:var(--f-dot);font-size:10px;color:var(--sodium)}
.carthumb>.drv.none{padding:5px 9px;font-size:11px;color:var(--mute)}
.carmini{display:inline-flex;align-items:center;gap:7px;padding:2px 8px 2px 2px;border-radius:8px;background:#7d8399;border:1px solid var(--line)}
.carmini img{width:58px;height:37px;border-radius:6px;image-rendering:pixelated;display:block}
.carmini b{font-family:var(--f-dot);font-size:11px;color:#0a0d1a;line-height:1.1;text-align:center}
.carmini b small{display:block;font-size:8px;letter-spacing:.08em;opacity:.75}
.bsw{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.bsv{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#7d8399;position:sticky;top:0}
.bsv canvas{display:block;width:100%;aspect-ratio:132/84;image-rendering:pixelated}
.bsflip{position:absolute;right:8px;bottom:8px;font:inherit;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid rgba(20,22,34,.5);background:rgba(20,22,34,.55);color:#eef0f8;cursor:pointer}
.bsflip:hover,.bsflip:focus-visible{background:rgba(20,22,34,.8)}
.bshint{position:absolute;left:10px;bottom:8px;font-family:"Press Start 2P",monospace;font-size:8px;color:#2a2e3e;pointer-events:none}
.bsc{display:flex;flex-direction:column;gap:12px;min-width:0}
.bsgrp{display:flex;flex-direction:column;gap:7px}
.bsgrp h4{margin:0;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:500}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
.swgrid.sm{grid-template-columns:repeat(6,26px)}
.sw{width:100%;aspect-ratio:1;min-height:24px;border-radius:6px;border:2px solid rgba(255,255,255,.14);cursor:pointer;padding:0}
.sw.on{border-color:var(--sodium);box-shadow:0 0 0 2px rgba(255,176,59,.35)}
.sw.custom{display:grid;place-items:center;background:conic-gradient(#f33,#fc3,#3c6,#3cf,#63f,#f3c,#f33);color:#fff;font-weight:700;position:relative;overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:inherit;font-size:12px;padding:5px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer}
.seg button.on{border-color:var(--sodium);color:var(--ink);background:rgba(255,176,59,.12)}
.colin{width:44px;height:28px;border:1px solid var(--line);border-radius:6px;background:none;padding:0 2px}
.numin{width:70px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.bsfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;border-top:1px solid var(--line);padding:10px 0 4px;position:sticky;bottom:-20px;background:var(--panel);z-index:2}
.bsfoot>span{margin-right:auto;font-size:13px;color:var(--dim)}
@media (max-width:760px){.bsw{grid-template-columns:1fr}.bsv{position:relative}}

#sCred,.brand,.pill.season{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.chip.legend{color:#d8dde4;border-color:#d8dde488;background:rgba(142,147,154,.14)}
.lc.ghost{border-color:#8e939a99;background:rgba(40,44,52,.9)}
.lc.ghost .n{color:#d8dde4}
.ghostnote{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid #8e939a66;background:rgba(142,147,154,.08);font-size:13px;line-height:1.45;color:var(--dim)}
.ghostnote b{font-family:var(--f-display);font-weight:400;font-size:15px;color:#d8dde4}
.ghostnote .av{width:40px;height:40px;flex:none}
.prog{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.pl{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.plh{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);min-width:44px}
.chip.perk{color:#c9b8ff;border-color:#c9b8ff55}
.kns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;flex:1;min-width:0}
.kn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);white-space:nowrap;min-width:0}
.kn b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:72px}
.kn i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;min-width:24px}
.kn i em{display:block;height:100%;background:var(--cyan)}
.perkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.perkopt{text-align:left;display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;font:inherit}

function strHash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hash2(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),u),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),u),v)*2-1}

function spec(c){
  const m=CARS[c.model];
  const hp=m.hp*[1,1.12,1.25,1.42][c.engine];
  const kg=m.kg-[0,45,95][c.weight];
  const pw=hp/kg*1000;
  const condF=.75+.25*(c.cond??100)/100;
  const powerN=clamp((pw-110)/240,0,1)*condF;
  const handN=clamp(m.hand/100+c.susp*.06+c.lsd*.03+c.weight*.015,0,1)*condF;
  const wearF=1-Math.max(0,c.tyre.wear-45)/110;
  const gripN=clamp(TYRES[c.tyre.grade].grip*wearF+c.susp*.025+(m.drive==='AWD'?.04:0),0,1);
  const brakeN=clamp(.42+c.brakes*.17+(1100-kg)/2500,0,1);
  const pi=Math.round((powerN*.38+handN*.24+gripN*.24+brakeN*.14)*1000);
  const ts=topSpeed(c);
  return{hp:Math.round(hp),kg,pw,powerN,handN,gripN,brakeN,drive:m.drive,lsd:c.lsd,pi,top:ts.top,limited:ts.limited,gears:GB[c.model].g.length};
}

/* Growth pace. GROW_K scales every run's gain, GROW_SOFT sets how hard gains shrink as a stat climbs,
   LVUP_K scales the bonus points a level-up gives. 1, 1.25 and 1 were the original (fast) values. */
const GROW_K=.6,GROW_SOFT=1.6,LVUP_K=.6;
function grow(d,emph,mult){
  const tal=(hasT(d,'natural')?1.35:1)*mult;const ups={};
  STATS.forEach(([k])=>{let e=emph[k]??1;if(hasT(d,'latebrake')&&k==='brk')e*=1.3;const s=d.stats[k];const g=GROW_K*1.5*e*Math.pow(Math.max(0,1-s/100),GROW_SOFT)*(.6+R()*.8)*tal*(s>80?1-(s-80)/40:1);d.stats[k]=Math.max(s,Math.min(99,s+g));ups[k]=g});

}
function giveXP(d,xp,notes){

  if(after>before){for(let i=0;i<after-before;i++){const ks=STATS.map(s=>s[0]).sort(()=>R()-.5).slice(0,2);ks.forEach(k=>d.stats[k]=Math.max(d.stats[k],Math.min(99,d.stats[k]+(1.5+R()*.8)*LVUP_K*(d.stats[k]>85?.5:1))))}notes.push(`Level ${after}!`);if(PERK_LV.some(l=>l>before&&l<=after)){notes.push('Perk ready');addLog(`${d.first} reached level ${after}. A new perk is ready in the Crew tab.`);toast(`${d.first} can pick a new perk`)}}
}

/* incidents: spins, offs, crashes, breakdowns */
const INC_LABEL={spin:'Spun out',off:'Off the road',crash:'Crashed',break:'Broke down',hit:'Contact'};
function incidentRisk(d,c,w){

  const dr=CARS[c.model].drive,wx=w==='Wet'?(hasT(d,'rain')?1.2:1.7)*TYRES[c.tyre.grade].wetRisk*(dr==='AWD'?.75:dr==='FF'?.9:1.1):w==='Fog'?(hasT(d,'fog')?1:1.25):w==='Snow'?(hasT(d,'ice')?1.4:2)*TYRES[c.tyre.grade].snowRisk*(dr==='AWD'?.65:dr==='FF'?.85:1.2):1;
  const foc=(1.35-.7*d.stats.foc/100)*(hasT(d,'ice')?.65:1);
  return{slide:(.012+tyre*.3+cond*.12)*wx*foc,brk:c.cond<60?.004+(60-c.cond)/60*.22:.002,tyreBad:c.tyre.wear>80,wet:w==='Wet'||w==='Snow'};
}
function rollIncidents(d,c,T,w,race,rng){

  const spots=T.hair.filter(i=>i>N*.08&&i<N*.96);const at=()=>spots.length?spots[Math.floor(rng()*spots.length)]:Math.floor(N*(.15+rng()*.75));

  if(rng()<k.brk*(race?1.3:1))out.push(mkInc('break',Math.floor(N*(.25+rng()*.65)),rng));
  out.sort((a,b)=>a.i-b.i);const cut=out.findIndex(x=>x.dnf);return cut>=0?out.slice(0,cut+1):out;

function mkInc(type,i,rng){rng=rng||R;const x={type,i};
  if(type==='spin'){x.loss=3+rng()*4;x.cond=2+rng()*4;x.tofu=4+rng()*6}

  else if(type==='hit'){x.loss=.5+rng()*1.5;x.cond=4+rng()*8;x.tofu=6}
  else if(type==='crash'){x.dnf=true;x.cond=30+rng()*25;x.tow=20000}

function setsOf(c){return c.sets||(c.sets={})}
function fitNew(c,g){const t=TYRES[g];if(S.money<t.cost)return false;AUDIO.coin();S.money-=t.cost;if(c.tyre&&c.tyre.grade!==g)setsOf(c)[c.tyre.grade]=c.tyre.wear;c.tyre={grade:g,wear:0};return true}
function fitSpare(c,g){const s=setsOf(c);if(s[g]==null||S.money<SWAP_FEE)return false;AUDIO.coin();S.money-=SWAP_FEE;const w=s[g];delete s[g];s[c.tyre.grade]=c.tyre.wear;c.tyre={grade:g,wear:w};return true}
function tyreOptions(c){return TYRES.map((t,g)=>{const s=setsOf(c);if(c.tyre.grade===g)return{g,kind:'fitted',label:`${t.name} · fitted · ${Math.round(c.tyre.wear)}% worn`};if(s[g]!=null)return{g,kind:'spare',label:`${t.name} · spare set · ${Math.round(s[g])}% worn · swap ${yenK(SWAP_FEE)}`,ok:S.money>=SWAP_FEE};return{g,kind:'buy',label:`${t.name} · buy new ${yenK(t.cost)}`,ok:S.money>=t.cost}})}

function saveCode(){const b=new TextEncoder().encode(JSON.stringify(S));let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return'TTT1:'+btoa(s)}
function readCode(code){code=(code||'').replace(/\s+/g,'');if(!code.startsWith('TTT1:'))throw new Error('prefix');const bin=atob(code.slice(5)),b=Uint8Array.from(bin,c=>c.charCodeAt(0)),o=JSON.parse(new TextDecoder().decode(b));if(!o||o.v!==1||!Array.isArray(o.drivers)||!Array.isArray(o.cars)||!o.drivers.length)throw new Error('shape');return o}

function buntaRun(list){
  const T=MAP.homeTrack(),N=T.len,d={id:-1,first:'Bunta',family:'Fujiwara',seed:19631,stats:{brk:118,crn:122,dft:122,ht:120,thr:115,foc:125},trait:'fog',perks:[],know:{usuzumi:100},xp:0,legend:true};
  const c={id:-1,model:'gc8',c1:'#8e939a',c2:shade('#8e939a',-.42),paint:'Grey',engine:3,susp:3,brakes:2,lsd:1,weight:2,cradle:false,tyre:{grade:2,wear:4},cond:100};
  const prof=MAP.profile(d,c,S.weather),last=list[list.length-1].start,start=last+5+R()*4;
  const fin=list.filter(r=>r.dnf==null).map(r=>r.start+r.cumReal[N-1]),first=fin.length?Math.min(...fin):start+prof.time;
  /* he gains his time in the corners, not on the straights, so his top speed stays real */
  const target=Math.min(prof.time*.98,first-14-R()*10-start),cum=prof.cum;let tot=0,cw=0;const w=new Float32Array(N);for(let x=1;x<N;x++){w[x]=Math.min(1,Math.abs(T.curv[x])*2.4);const dt=cum[x]-cum[x-1];tot+=dt;cw+=dt*w[x]}
  const a=clamp((tot-target)/(cw||1),.02,.45),cumReal=new Float32Array(N);for(let x=1;x<N;x++)cumReal[x]=cumReal[x-1]+(cum[x]-cum[x-1])*(1-a*w[x]);
  return{ghost:true,d,c,start,cumReal,incs:[],dnf:null,res:{sp:spec(c),prof:Object.assign({},prof,{cum:cumReal}),time:cumReal[N-1],dmg:0,notes:[],fresh:1,price:0,xp:0,incs:[],dnf:null}};
}

function showHelp(intro){
  modal(`<div class="eyebrow">${intro?'04:30 · Mt. Usuzumi':'How it works'}</div><h2>${intro?'The shop at the bottom of the pass':'Running Kasumi Tofu'}</h2>
  ${intro?`<p>Every morning before dawn, Grand Hotel Kumoi at the summit takes delivery of your tofu. Your son Kenta drives it up in the family AE86 while the pass is empty. The kitchen pays for freshness, and it pays for tofu that arrives in one piece.</p>`:''}
  <p><b>Weekly cycle.</b> Sunday to Saturday, one dawn delivery a day. Each car carries one batch, so the number of runs is capped by both your crew and your production line.</p>
  <p><b>Driving.</b> Every run trains braking, cornering, drifting, heel-toe, throttle and focus. Faster runs mean fresher tofu. Smooth inputs and good suspension mean less damage. Both raise what the hotel pays.</p>
  <p><b>Garage.</b> Spend on engine, suspension, brakes, a limited-slip diff, weight reduction and a sprung tofu cradle. Watch tyre wear: bald tyres cost grip and time.</p>
  <p><b>Risk.</b> Bald tyres, a battered car, rain and fog make spins, slides off the road, breakdowns and crashes more likely. A crash or breakdown loses that run and costs a tow, and the damage needs repairing in the Garage. A car below 15% condition can't drive.</p>
  <p><b>Traffic.</b> Cars leave the shop about 12 seconds apart in crew order. A faster car that catches a slower one has to follow until a straight, then pass. Rushed passes and sudden stops can end in contact, and both cars take damage.</p>
  <p><b>Tyres and weather.</b> Saturday's race-night forecast appears in the morning, so you can swap tyres before racing. Each car keeps its spare sets, and swapping back costs a small fitting fee. Semi-slicks are fastest in the dry but lose half their grip in the rain and spin easily. Four-wheel drive copes best in the wet, then front-drive, then rear-drive. Downhill, weight and nimbleness count for more than power.</p>
  <p><b>Touge battles.</b> Races start side by side, or as leader and chaser by coin toss. The chaser can draft on straights, pile on pressure until the leader slips, and use special moves: Slipstream, Late Brake, Gutter Run, Feint Drift, Lights Out and Around the Outside. Drivers learn moves as their stats grow, and Iron Wall helps a leader defend. Tyres wear through a race, so a patient approach can win late.</p>
  <p><b>Driver progression.</b> Stats grow with every run, more slowly once they pass 80. Each driver also builds knowledge of every pass they drive, which makes them faster there and less likely to make mistakes. Special moves rank up from I to III as a driver lands them in races. At levels ${PERK_LV.join(', ')} a driver picks a permanent perk. Rivals know their home pass well.</p>
  <p><b>Seasons.</b> Spring, summer, autumn and winter each last ${SEASON_WEEKS} weeks. The trees and grass change colour, early summer brings the rainy season, autumn brings fog and winter brings snow. On snow, studless tyres and four-wheel drive matter most. Shiga-Kusatsu closes for winter.</p>
  <p><b>Saturday night.</b> Up to two touge battles, one uphill and one downhill. Wins earn purses and street cred. Cred unlocks new passes, raises the hotel's price, and convinces beaten rivals to join your crew with their own cars.</p>

/* ================= tutorial ================= */
const TUT=(()=>{
  const q=s=>typeof s==='function'?s():s?document.querySelector(s):null;
  const modalOpen=()=>!$('#modal').hidden;
  const results=()=>modalOpen()&&!!document.querySelector('#modal .tot');
  const calm=()=>!busy&&!modalOpen();
  let mark=null;
  const STEPS=[
    {t:'Welcome to Kasumi Tofu',b:'You run a small tofu shop at the foot of Mt. Usuzumi. Every dawn a batch goes up the pass to Grand Hotel Kumoi at the summit. Faster, smoother runs mean fresher tofu and a better price. Let\'s do your first delivery together.',btn:'Show me',skipBtn:true,dim:true},
    {t:'Meet Kenta',target:'#pbody .card',enter:()=>{if(TAB!=='crew'){TAB='crew';renderTabs();renderPanel()}},b:'Your son and first driver. Braking, cornering, drifting, heel-toe, throttle and focus grow with every run, and OVR is his overall rating. Pick a driver\'s car here, and tick Dawn run to put them on the morning delivery.',btn:'Next',dim:true,show:calm},
    {t:'Send the dawn run',target:'#actionbar [data-act="dispatch"]',b:'It\'s 04:30 and the pass is empty. Hit Dispatch to send Kenta up the mountain.',dim:true,show:()=>calm()&&S.phase==='pre',skip:()=>!busy&&S.phase!=='pre',done:()=>busy},
    {t:'On the pass',target:'#live',b:'Top left counts the hairpins to go. The driver card shows speed and the tofu, which takes a knock from rough driving. Drag the map or use Whole pass and Follow to move the camera, or skip straight to the results.',btn:'Got it',show:()=>busy,skip:()=>!busy&&S.phase!=='pre',done:()=>!busy},
    {t:'Payday',target:'#modal .tot',b:'The hotel pays for freshness, which comes from a fast run, and for tofu that arrives in one piece. Beans, fuel and wages come out of that. Press Continue when you\'re done.',show:results,skip:()=>!busy&&!modalOpen(),done:()=>!busy&&!modalOpen()},
    {t:'The garage',target:'.tab[data-t="garage"]',b:'Money goes back into the car. Open the Garage.',dim:true,show:calm,done:()=>TAB==='garage'},
    {t:'Tune the hachi-roku',target:'#pbody .card',b:'Engine, suspension, brakes and a limited-slip diff make every run faster. Watch tyre wear and car condition: bald tyres and a battered car spin, break down and crash more often. New tyres and repairs are here too.',btn:'Next',dim:true,show:calm},
    {t:'The week',target:'#days',b:'One dawn delivery a day, Sunday to Saturday. Saturday night is race night on the touge, where wins earn prize money and street cred.',btn:'Next',dim:true,show:calm},
    {t:'Grow the shop',target:'#tabs',b:'Dealer sells used cars, and legends once your cred is high enough. Shop adds presses for more batches a day and better tofu for a higher price. Touge lists the passes and the cred each one needs. Beaten rivals sometimes join your crew with their own cars.',btn:'Next',dim:true,show:calm},
    {t:'Close up',target:'#actionbar .btn.big',b:'That\'s day one. Close up for the day and the next dawn run begins. Tap ? any time to replay this tutorial.',dim:true,show:calm,enter:()=>{mark=S.week*10+S.day},skip:()=>S.phase==='pre'&&!busy,done:()=>S.week*10+S.day!==mark}
  ];
  const TIPS=[
    {k:'press',target:'#actionbar',t:'More drivers than presses',b:'Each press makes one batch a day, and every batch needs its own car. Add presses in the Shop tab so the whole crew can run.',when:()=>calm()&&S.phase==='pre'&&readyDrivers().length>plannedRuns().length},
    {k:'recruit',target:'.tab[data-t="crew"]',t:'New crew member',b:'A rival has joined Kasumi Tofu. In the Crew tab, check they have a car and tick Dawn run. More drivers mean more batches, as long as you have the presses.',when:()=>calm()&&S.drivers.length>1},
    {k:'wet',target:'#clock',t:'Rain on the pass',b:'Grip is down and spins and crashes are more likely. Street tyres and four-wheel drive cope best, and semi-slicks are a gamble. Drivers with Rain Dancer barely notice.',when:()=>calm()&&S.phase==='pre'&&S.weather==='Wet'},
    {k:'fog',target:'#clock',t:'Fog on the pass',b:'Speeds stay low and focus matters most. Drivers with Fog Eyes ignore it. On race night, Lights Out is deadly in the fog.',when:()=>calm()&&S.phase==='pre'&&S.weather==='Fog'},
    {k:'perk',target:'.tab[data-t="crew"]',t:'Perk ready',b:'A driver has reached a perk level. Open the Crew tab and press Choose a perk. Perks keep top drivers improving after their stats max out.',when:()=>calm()&&S.drivers.some(d=>perkPending(d)>0)},
    {k:'snow',target:'#clock',t:'Snow on the pass',b:'Grip is the worst it gets. Studless winter tyres from the Garage are the only safe choice, four-wheel drive is king and rear-drive cars will struggle.',when:()=>calm()&&S.phase==='pre'&&S.weather==='Snow'},
    {k:'season',target:'#clock',t:'The seasons turn',b:'Each season lasts a few weeks and changes the weather: a rainy early summer, foggy autumns and snowy winters. Shiga-Kusatsu closes for winter, just like the real Route 292.',when:()=>calm()&&S.phase==='pre'&&S.week>SEASON_WEEKS},
    {k:'tyres',target:'.tab[data-t="garage"]',t:'Tyres wearing thin',b:'A car\'s tyres are getting bald. They lose grip and make spins more likely. Fit a new set in the Garage.',when:()=>calm()&&S.cars.some(c=>c.tyre.wear>70)},
    {k:'damage',target:'.tab[data-t="garage"]',t:'Car damaged',b:'Low condition raises the risk of breakdowns and crashes, and below 15% a car can\'t drive. Repair it in the Garage.',when:()=>calm()&&S.cars.some(c=>c.cond<60)},
    {k:'sat',target:'#clock',t:'Race day',b:'Tonight\'s forecast is up top. Do the dawn run first, then open Saturday night touge to pick your battles. You can swap tyres in the race planner to suit the weather.',when:()=>calm()&&S.day===6&&S.phase==='pre'},
    {k:'race',target:'#feed',t:'Touge battle',b:'The car behind can draft on straights, pile on pressure and strike with special moves, which flash up as banners. Drivers learn new moves as their stats grow. The Crew tab shows who knows what.',when:()=>busy&&S.phase==='race'}
  ];
  let card,ring,key='',tip=null,entered=-1;
  function els(){if(card)return;card=document.createElement('div');card.id='coach';card.setAttribute('role','dialog');card.setAttribute('aria-live','polite');ring=document.createElement('div');ring.id='coachRing';document.body.append(ring,card)}
  function hide(){if(!card)return;card.hidden=true;ring.hidden=true;key=''}
  function draw(it,k,label,foot){
    els();const fresh=key!==k;if(fresh){key=k;card.innerHTML=`<div class="ch">${label?`<span class="cn">${label}</span>`:''}<b>${esc(it.t)}</b></div><p>${esc(it.b)}</p><div class="cb">${foot}</div>`}
    card.hidden=false;const el=q(it.target);if(fresh&&el&&el.scrollIntoView)el.scrollIntoView({block:'nearest'});const r=el&&el.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,cw=card.offsetWidth,chh=card.offsetHeight;
    let x,y;
    if(r&&r.width>0&&r.height>0){ring.hidden=false;const p=6;Object.assign(ring.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+p*2+'px',height:r.height+p*2+'px'});ring.classList.toggle('dim',!!it.dim);ring.classList.remove('bare');
      if(r.bottom+14+chh<vh)y=r.bottom+14;else if(r.top-14-chh>0)y=r.top-14-chh;else y=vh-chh-16;
      x=r.left+r.width/2-cw/2;if(y>=r.top-chh-14&&y<=r.bottom){if(r.right+14+cw<vw){x=r.right+14;y=r.top}else if(r.left-14-cw>0){x=r.left-14-cw;y=r.top}}
    }else{ring.hidden=!it.dim;if(it.dim){ring.classList.add('dim','bare');Object.assign(ring.style,{left:vw/2+'px',top:vh/2+'px',width:'0px',height:'0px'})}x=(vw-cw)/2;y=(vh-chh)/2}
    card.style.left=clamp(x,12,vw-cw-12)+'px';card.style.top=clamp(y,12,vh-chh-12)+'px';card.classList.toggle('center',!(r&&r.width>0));
  }
  function next(){S.tut.s++;entered=-1;if(S.tut.s>=STEPS.length){S.tut.s=-1;hide();toast('Tutorial done. Tap ? to replay it.')}save()}
  function tick(){
    if(!S)return;if(!S.tut){hide();return}
    if(S.tut.s>=0){const st=STEPS[S.tut.s];if(!st){S.tut.s=-1;return}
      if(entered!==S.tut.s){entered=S.tut.s;st.enter&&st.enter();if(st.skip&&st.skip()){next();return}}
      if(st.done&&st.done()){next();return}
      if(st.show&&!st.show()){hide();return}
      draw(st,'s'+S.tut.s,`${S.tut.s+1}/${STEPS.length}`,`${st.skipBtn?'<button class="btn sm" data-act="tutSkip">Skip tutorial</button>':'<button class="btn sm ghost" data-act="tutSkip">End tutorial</button>'}${st.btn?`<button class="btn sm primary" data-act="tutNext">${st.btn}</button>`:''}`);return}
    if(tip&&S.tut.tips[tip.k])tip=null;
    if(!tip)tip=TIPS.find(x=>!S.tut.tips[x.k]&&x.when())||null;
    if(!tip){hide();return}
    if(!tip.when()&&!(tip.k==='race'&&busy)){if(calm()||busy){tip=null}hide();return}
    draw(tip,'t'+tip.k,'Tip',`<button class="btn sm primary" data-act="tipOk" data-k="${tip.k}">Got it</button>`);
  }
  function init(){
    if(!S.tut)S.tut=(S.batches>0||S.week>1||S.seenIntro)?{s:-1,tips:Object.fromEntries(TIPS.map(x=>[x.k,1]))}:{s:0,tips:{}};
    entered=-1;tip=null;hide();
  }
  setInterval(()=>{try{tick()}catch(e){}},160);
  addEventListener('resize',()=>{key=key&&key+'_'});
  return{init,next,skip:()=>{S.tut.s=-1;hide();save();toast('Tutorial skipped. Tap ? to replay it.')},tipOk:k=>{S.tut.tips[k]=1;tip=null;hide();save()},
    replay:()=>{S.tut={s:0,tips:{}};entered=-1;tip=null;save();if(TAB!=='crew'){TAB='crew';renderAll()}},allTips:()=>Object.fromEntries(TIPS.map(x=>[x.k,1]))};
})();

/* ================= boot ================= */
function boot(data){
  S=(data&&data.S)||load();if(!S){newGame()}normDrivers();if(S.phase==='race')S.phase='post';
  window.claude?.hot?.snapshot?.(()=>({S}));
  const go=()=>{
    MAP.init($('#map'));{const sb=$('#sndBtn');if(sb)sb.classList.toggle('on',AUDIO.on());const bb=$('#bgmBtn');if(bb)bb.classList.toggle('on',MUSIC.on())}MAP.setDarkNow(S.phase==='post'?.12:1);
    TUT.init();renderAll();NET.init();
  };
  const fr=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
  fr.then(go,go);
}
if(!window.TOUGE_ADMIN){window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});}
</script>

<script>
/* ================= Touge Net control room (admin.html only) =================
   Reads every handle, profile and challenge straight from Supabase (all public),
   and calls the admin_* database functions for anything destructive. Those functions
   refuse unless this browser's sign-in is listed in public.admins. */
const ADMIN=(()=>{
  const X=window.TOUGE_NETX,KIND={ch:'Challenge',gh:'Ghost race',ghd:'Raced your ghost',cpu:'Local race'},DAYMS=864e5;
  let me={uid:null,admin:false,fn:true},data={handles:{},players:{},ch:[],inbox:{}},bans=[],sel=null,q='',sort='seen',filt='all',tab='players',confirmK=null,loading=true,errMsg='',lastLoad=0;
  const root=()=>document.getElementById('adm');
  const mt=id=>MTNS.concat(typeof GENTING!=='undefined'?[GENTING]:[]).find(m=>m.id===id);
  const ago=t=>{if(!t)return'never';const d=(Date.now()-t)/DAYMS;return d<1/1440?'just now':d<1/24?Math.round(d*1440)+'m ago':d<1?Math.round(d*24)+'h ago':d<60?Math.round(d)+'d ago':new Date(t).toLocaleDateString()};
  const day=t=>t?new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}):'–';
  const short=u=>u?String(u).slice(0,8):'–';
  const tms=x=>typeof x==='number'?x:x?Date.parse(x)||0:0;
  function note(t,bad){const el=document.createElement('div');el.className='toast'+(bad?' bad':'');el.textContent=t;(document.getElementById('toasts')||document.body).appendChild(el);setTimeout(()=>el.remove(),3200)}

  /* ---------- loading ---------- */
  async function all(filter){let out=[],from=0;for(;;){let r=X.sb.from('docs').select('path,id,coll,data,owner,updated_at');r=filter(r).order('path').range(from,from+999);
      const{data:d,error}=await r;if(error)throw error;out=out.concat(d||[]);if(!d||d.length<1000)break;from+=1000}return out}
  async function load(){loading=true;errMsg='';render();
    try{
      await X.session();
      const r=await X.sb.rpc('admin_me');if(r.error){me={uid:await X.session(),admin:false,fn:false}}else me=Object.assign({fn:true},r.data);
      const[hs,ps,cs,ib]=await Promise.all([all(x=>x.eq('coll','handles')),all(x=>x.eq('coll','players')),all(x=>x.eq('coll','challenges')),all(x=>x.like('coll','players/%/inbox'))]);
      data={handles:{},players:{},ch:[],inbox:{}};
      hs.forEach(d=>data.handles[d.id]=Object.assign({},d.data,{owner:d.owner,upd:tms(d.updated_at)}));
      ps.forEach(d=>data.players[d.id]=Object.assign({},d.data,{owner:d.owner,upd:tms(d.updated_at)}));
      data.ch=cs.map(d=>Object.assign({id:d.id,upd:tms(d.updated_at)},d.data)).sort((a,b)=>(b.t||0)-(a.t||0));
      ib.forEach(d=>{const k=d.coll.split('/')[1];data.inbox[k]=(data.inbox[k]||0)+1});
      bans=[];if(me.admin){const b=await X.sb.rpc('admin_bans');if(!b.error)bans=b.data||[]}
      lastLoad=Date.now();
    }catch(e){errMsg=(e&&e.message)||'Could not reach Supabase.'}
    loading=false;if(sel&&!rowOf(sel))sel=null;render()}

  /* ---------- model ---------- */
  function rowOf(k){const H=data.handles[k],P=data.players[k];if(!H&&!P)return null;
    const ch=data.ch.filter(c=>c.from===k||c.to===k),seen=Math.max(P&&P.t||0,H&&H.t||0,P&&P.upd||0);
    return{k,h:(P&&P.h)||(H&&H.h)||k,H,P,blocked:!!(H&&H.blocked),ovr:P?Math.round(P.ovr||0):0,w:P?P.w||0:0,l:P?P.l||0:0,rw:P?P.rw||0:0,rl:P?P.rl||0:0,wk:P?P.wk||0:0,seen,joined:H&&H.t||0,owner:(H&&H.owner)||(P&&P.owner),ch,inbox:data.inbox[k]||0,
      top:P&&Array.isArray(P.roster)&&P.roster.length?P.roster.slice().sort((a,b)=>(b.ovr||0)-(a.ovr||0))[0]:P&&Array.isArray(P.crew)&&P.crew[0]||null,banned:bans.some(b=>b.uid===((H&&H.owner)||(P&&P.owner)))}}
  function rows(){const keys=new Set(Object.keys(data.handles).concat(Object.keys(data.players)));let R=[...keys].map(rowOf).filter(Boolean);
    const wk=Date.now()-7*DAYMS;
    if(filt==='active')R=R.filter(r=>r.seen>=wk&&!r.blocked);else if(filt==='blocked')R=R.filter(r=>r.blocked);else if(filt==='noprof')R=R.filter(r=>!r.P&&!r.blocked);else R=R.filter(r=>!r.blocked);
    if(q){const s=q.toLowerCase();R=R.filter(r=>r.k.includes(s)||r.h.toLowerCase().includes(s)||(r.P&&(r.P.roster||[]).some(d=>(d.first+' '+d.family).toLowerCase().includes(s))))}
    const S2={ovr:(a,b)=>b.ovr-a.ovr,seen:(a,b)=>b.seen-a.seen,wins:(a,b)=>b.w-a.w||a.l-b.l,new:(a,b)=>b.joined-a.joined,name:(a,b)=>a.k.localeCompare(b.k)}[sort];
    return R.sort(S2)}

  /* ---------- views ---------- */
  function statsBar(){const keys=new Set(Object.keys(data.handles).concat(Object.keys(data.players))),wk=Date.now()-7*DAYMS;let act=0,blk=0;
    keys.forEach(k=>{const r=rowOf(k);if(!r)return;if(r.blocked)blk++;else if(r.seen>=wk)act++});
    const open=data.ch.filter(c=>c.st==='pending'||c.st==='accepted'||c.st==='running').length,done=data.ch.filter(c=>c.st==='done').length;
    const st=(l,v)=>`<div class="stat"><label>${l}</label><b>${v}</b></div>`;
    return`<div class="astats">${st('Handles',keys.size-blk)}${st('Active 7 days',act)}${st('Open challenges',open)}${st('Battles raced',done)}${st('Blocked names',blk)}${st('Banned devices',me.admin?bans.length:'–')}</div>`}
  function gate(){if(!me.fn)return`<div class="card agate bad"><b>The admin tools aren't in your database yet.</b><span class="meta">Run the updated <code>setup.sql</code> in Supabase → SQL Editor, then reload this page.</span></div>`;
    if(me.admin)return'';
    const line=`insert into public.admins (uid, note) values ('${me.uid}', 'my browser');`;
    return`<div class="card agate"><div class="eyebrow">Read only</div><b>This browser isn't an admin yet.</b>
      <span class="meta">You can browse everything, but deleting needs admin rights. In Supabase, open SQL Editor → New query, paste this line, click Run, then reload this page.</span>
      <div class="acode"><code id="admLine">${esc(line)}</code><button class="btn" data-adm="copy">Copy</button></div>
      <span class="meta">Admin rights belong to this browser's sign-in. If you clear this browser's data you'll get a new ID and need to run the line again.</span></div>`}
  function listRow(r){const d=r.top;return`<button type="button" class="arow ${sel===r.k?'on':''}" data-adm="pick" data-k="${esc(r.k)}" aria-pressed="${sel===r.k}">
      ${d&&d.seed?`<img class="av" src="${avatar(d.seed)}" alt="">`:'<span class="av noav">?</span>'}
      <span class="an"><b>@${esc(r.h)}</b><span class="meta">${r.blocked?'Blocked name':r.P?`${r.w}W ${r.l}L · seen ${ago(r.seen)}`:'No profile yet'}${r.banned?' · banned':''}</span></span>
      <span class="povr"><small>OVR</small>${r.P?r.ovr:'–'}</span></button>`}
  function listView(){const R=rows();
    return`<div class="alist card"><div class="atools">
        <label class="sr" for="admQ">Search handles or drivers</label><input id="admQ" type="search" placeholder="Search @handle or driver" value="${esc(q)}" autocomplete="off">
        <label class="sr" for="admSort">Sort</label><select id="admSort">${[['seen','Last seen'],['ovr','Crew OVR'],['wins','Battles won'],['new','Newest'],['name','A to Z']].map(([v,l])=>`<option value="${v}" ${sort===v?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="achips" role="group" aria-label="Filter">${[['all','All'],['active','Active 7 days'],['noprof','No profile'],['blocked','Blocked']].map(([v,l])=>`<button type="button" class="chip ${filt===v?'on':''}" data-adm="filt" data-v="${v}" aria-pressed="${filt===v}">${l}</button>`).join('')}</div>
      <div class="arows">${R.length?R.map(listRow).join(''):`<div class="meta aempty">${loading?'Loading…':q?'No handles match that search.':'Nobody here yet.'}</div>`}</div></div>`}
  function chRow(c,k){const m=mt(c.crit&&c.crit.m),other=c.from===k?c.th||c.to:c.fh||c.from,dir=c.from===k?'sent to':'from',res=c.res;
    const win=res&&res.win?(res.win===k?'W':'L'):res?'D':null;
    return`<div class="phr">${win?`<span class="res ${win}">${win==='W'?'WON':win==='L'?'LOST':'DRAW'}</span>`:`<span class="res st">${esc((c.st||'pending').toUpperCase())}</span>`}
      <div><b>${dir} @${esc(other)}</b> <span class="meta">${m?esc(m.name):'?'} ${c.crit&&c.crit.dir==='down'?'downhill':'uphill'}${c.crit&&c.crit.wager?' · ¥'+(c.crit.wager/1000)+'k':''} · ${day(c.t)}</span>${res&&res.line?`<div class="meta">${esc(res.line)}</div>`:''}</div>
      ${me.admin?`<button class="btn sm ghost" data-adm="delch" data-id="${esc(c.id)}" aria-label="Delete this challenge">Delete</button>`:''}</div>`}
  function detail(){const r=sel&&rowOf(sel);if(!r)return`<div class="card adetail aempty"><div class="eyebrow">管理室</div><h2>Pick a handle</h2><p class="meta">Choose a player on the left to see their crew, record and battles.</p></div>`;
    const P=r.P||{},ros=Array.isArray(P.roster)&&P.roster.length?P.roster:(P.crew||[]),ds=ros.slice().sort((a,b)=>(b.ovr||0)-(a.ovr||0));
    const drv=ds.length?ds.map(d=>{const car=d.car&&CARS[d.car.model]?d.car:null;return`<div class="pdr"><img class="av" src="${avatar(d.seed||1)}" alt=""><div class="pn"><b>${esc(d.first||'?')} ${esc(d.family||'')}</b><span class="meta">Level ${d.lv||1}${d.trait&&TRAITS[d.trait]?' · '+TRAITS[d.trait].name:''}</span></div><span class="povr"><small>OVR</small>${Math.round(d.ovr||0)}</span>
      ${car?`<span class="pcar"><img src="${SPR.url(car,132,84)}" alt=""><span><b>${esc(CARS[car.model].code)}</b> ${esc(CARS[car.model].name)}</span></span><span class="povr pi"><small>PI</small>${Math.round(car.pi||0)}</span>`:'<span class="pcar meta">No car</span><span></span>'}</div>`}).join(''):'<div class="meta">No drivers shared.</div>';
    const hist=Array.isArray(P.hist)?P.hist.slice(0,20):[];
    const hs=hist.length?hist.map(e=>{const m=mt(e.m);return`<div class="phr"><span class="res ${e.r}">${e.r==='W'?'WON':e.r==='L'?'LOST':'DRAW'}</span><div><b>${e.vs?'vs '+esc(e.vs):'vs a local challenger'}</b> <span class="meta">${m?esc(m.name):''} ${e.dir==='up'?'uphill':'downhill'} · ${KIND[e.k]||'Race'}${e.when?' · '+esc(e.when):''}</span><div class="meta">${esc(e.line||'')}</div></div></div>`}).join(''):'<div class="meta">No races shared.</div>';
    const conf=confirmK===r.k?confirmBox(r):'';
    return`<div class="card adetail"><div class="eyebrow">Touge Net profile${r.blocked?' · blocked name':''}${r.banned?' · banned device':''}</div><h2 class="phd">@${esc(r.h)}</h2>
      <div class="kv"><span>Crew OVR <b>${r.P?r.ovr:'–'}</b></span><span>Battles <b>${r.w}W ${r.l}L</b></span><span>All races <b>${r.rw}W ${r.rl}L</b></span><span>Game week <b>${r.wk||'–'}</b></span><span>Last seen <b>${ago(r.seen)}</b></span><span>Joined <b>${day(r.joined)}</b></span><span>Ghost notes <b>${r.inbox}</b></span><span>Device <b title="${esc(r.owner||'')}">${short(r.owner)}</b></span></div>
      <h3>Drivers</h3><div class="card pdrv">${drv}</div>
      <h3>Challenges <span class="meta inl">${r.ch.length}</span></h3><div class="card phist">${r.ch.length?r.ch.map(c=>chRow(c,r.k)).join(''):'<div class="meta">No challenges on record.</div>'}</div>
      <h3>Previous races</h3><div class="card phist">${hs}</div>
      <div class="card adanger"><div><b>${r.blocked?'Release this name':'Delete this account'}</b><span class="meta">${r.blocked?`@${esc(r.h)} is blocked, so nobody can claim it. Releasing it lets anyone take the name again.`:`Removes @${esc(r.h)}'s handle, profile, ghost notes, challenges and replays from Touge Net. Their saved game on their own device isn't touched.`}</span></div>
        ${me.admin?(r.blocked?`<button class="btn" data-adm="unblock" data-k="${esc(r.k)}">Release @${esc(r.h)}</button>`:`<button class="btn race" data-adm="ask" data-k="${esc(r.k)}">Delete account</button>`):'<span class="meta">Admins only</span>'}</div>${conf}</div>`}
  function confirmBox(r){return`<div class="card aconfirm" role="group" aria-label="Confirm delete">
      <b>Delete @${esc(r.h)} for good?</b>
      <label class="tog"><input type="checkbox" id="admBlock" checked> Block the name, so nobody can claim @${esc(r.h)} again</label>
      <label class="tog"><input type="checkbox" id="admBan"> Ban the device, so it can't claim any new handle</label>
      <span class="meta">With neither ticked, @${esc(r.h)} comes back the next time that player opens the game.</span>
      <label class="meta" for="admType">Type <b>${esc(r.k)}</b> to confirm</label><input id="admType" autocomplete="off" spellcheck="false">
      <div class="row"><button class="btn" data-adm="cancel">Cancel</button><button class="btn race" data-adm="del" data-k="${esc(r.k)}" disabled>Delete @${esc(r.h)}</button></div></div>`}
  function bansView(){const blocked=Object.keys(data.handles).filter(k=>data.handles[k].blocked);
    return`<div class="abans"><div class="card"><div class="eyebrow">Blocked names</div>${blocked.length?blocked.map(k=>`<div class="brow"><b>@${esc(data.handles[k].h||k)}</b><span class="meta">since ${day(data.handles[k].t)}</span>${me.admin?`<button class="btn sm" data-adm="unblock" data-k="${esc(k)}">Release</button>`:''}</div>`).join(''):'<div class="meta">No blocked names.</div>'}</div>
      <div class="card"><div class="eyebrow">Banned devices</div>${!me.admin?'<div class="meta">Only admins can see bans.</div>':bans.length?bans.map(b=>`<div class="brow"><b>${esc(short(b.uid))}</b><span class="meta">was @${esc(b.handle||'?')} · ${day(tms(b.t))}</span><button class="btn sm" data-adm="unban" data-u="${esc(b.uid)}">Lift ban</button></div>`).join(''):'<div class="meta">No banned devices.</div>'}</div></div>`}
  function render(){const el=root();if(!el)return;const fq=document.activeElement&&document.activeElement.id==='admQ',pos=fq?document.activeElement.selectionStart:0,ls=el.querySelector('.arows'),lsTop=ls?ls.scrollTop:0;
    el.innerHTML=`<header class="hud ahud"><div class="brand"><span class="k">霞豆腐店 管理室</span><span class="e">Touge Net control room</span></div>
        <div class="row"><span class="achip ${me.admin?'ok':''}">${me.admin?'Admin':'Read only'}</span><span class="meta">${loading?'Loading…':errMsg?'':'Updated '+ago(lastLoad)}</span><button class="btn" data-adm="reload">Refresh</button></div></header>
      ${errMsg?`<div class="card agate bad"><b>Couldn't load Touge Net.</b><span class="meta">${esc(errMsg)}. Check the Project URL and key in config.js, and that the Supabase project isn't paused.</span></div>`:''}
      ${gate()}${statsBar()}
      <div class="atabs" role="tablist">${[['players','Players'],['bans','Blocked and banned']].map(([v,l])=>`<button type="button" role="tab" class="tab ${tab===v?'on':''}" data-adm="tab" data-v="${v}" aria-selected="${tab===v}">${l}</button>`).join('')}</div>
      ${tab==='players'?`<div class="agrid ${sel?'has':''}">${listView()}${detail()}</div>`:bansView()}`;
    if(fq){const i=el.querySelector('#admQ');i.focus();try{i.setSelectionRange(pos,pos)}catch(e){}}const ls2=el.querySelector('.arows');if(ls2)ls2.scrollTop=lsTop}

  /* ---------- actions ---------- */
  async function rpc(fn,args,ok){const r=await X.sb.rpc(fn,args);if(r.error){note(r.error.message||'That did not work.',true);return null}ok&&note(ok(r.data));await load();return r.data}
  function bind(){const el=root();
    el.addEventListener('click',async e=>{const b=e.target.closest('[data-adm]');if(!b||b.disabled)return;const a=b.dataset.adm;
      if(a==='pick'){sel=b.dataset.k;confirmK=null;render();if(matchMedia('(max-width:860px)').matches){const d=el.querySelector('.adetail');d&&d.scrollIntoView({behavior:'smooth',block:'start'})}}
      else if(a==='filt'){filt=b.dataset.v;render()}
      else if(a==='tab'){tab=b.dataset.v;render()}
      else if(a==='reload')load();
      else if(a==='copy'){const t=el.querySelector('#admLine').textContent;try{await navigator.clipboard.writeText(t);note('Copied. Paste it into the SQL Editor and click Run.')}catch(x){const r=document.createRange();r.selectNodeContents(el.querySelector('#admLine'));const s=getSelection();s.removeAllRanges();s.addRange(r);note('Selected. Press Ctrl+C or Cmd+C to copy.')}}
      else if(a==='ask'){confirmK=b.dataset.k;render();const t=el.querySelector('#admType');t&&t.focus()}
      else if(a==='cancel'){confirmK=null;render()}
      else if(a==='del'){const k=b.dataset.k,blk=el.querySelector('#admBlock').checked,ban=el.querySelector('#admBan').checked;b.disabled=true;
        const d=await rpc('admin_delete_account',{k,block_name:blk,ban_device:ban},x=>`Deleted @${x.handle}: ${x.challenges} challenges, ${x.replays} replays, ${x.inbox} ghost notes.${x.blocked?' Name blocked.':''}${x.banned?' Device banned.':''}`);
        if(d){confirmK=null;if(!blk)sel=null;render()}}
      else if(a==='unblock')rpc('admin_unblock',{k:b.dataset.k},()=>'Name released.');
      else if(a==='unban')rpc('admin_unban',{u:b.dataset.u},()=>'Ban lifted.');
      else if(a==='delch')rpc('admin_delete_challenge',{cid:b.dataset.id},()=>'Challenge deleted.')});
    el.addEventListener('input',e=>{const t=e.target;if(t.id==='admQ'){q=t.value.trim();render()}else if(t.id==='admType'){const go=el.querySelector('[data-adm=del]');go&&(go.disabled=t.value.trim().toLowerCase()!==confirmK)}});
    el.addEventListener('change',e=>{if(e.target.id==='admSort'){sort=e.target.value;render()}})}
  function start(){document.documentElement.classList.add('admin');document.title='Touge Net Control Room';
    const el=document.createElement('div');el.id='adm';document.body.prepend(el);
    if(!X){el.innerHTML=`<div class="card agate bad" style="margin:16px"><div class="eyebrow">管理室</div><b>Touge Net isn't set up on this page.</b><span class="meta">Add your Supabase Project URL and publishable key to config.js (or to the TOUGE_NET block at the top of admin.html), then reload.</span></div>`;return}
    bind();load();setInterval(()=>{if(!document.hidden)load()},60000)}
  return{start}
})();
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(ADMIN.start,ADMIN.start);

</script>
</body>
